# The demo lives on ebot.vote (https://ebot.vote/demos/program-assistant/), built from this repository's main.
# GitHub Pages only redirects there: any path under /program-data-assistant/ goes to the same path on ebot.vote.
# The web app is still checked, tested and built here on every push; it just isn't deployed to Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Check and test
        working-directory: web
        run: |
          npm run check
          npm test
      - name: Build (demo mode)
        working-directory: web
        run: npm run build

  build:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redirect site
        run: |
          mkdir site
          cp .github/pages-redirect/index.html site/index.html
          cp .github/pages-redirect/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
