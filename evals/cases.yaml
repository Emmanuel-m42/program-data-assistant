  # Written on 2026-11-21, after the eval-v3 results were published, to make the clean held-out claim rest on more
  # than 15 questions. Measurement only: no code, prompt or data change follows it before its runs. Same fictional
  # data; ground truth is SQL on the raw tables, never the views, and every numeric truth has an independent second
  # query in the audit. The extra field says what kind of case it is:
  #   new           a new question (w01 to w41), in organizer phrasing: short and casual, long and specific, typos,
  #                 multi-part. w07 and w15 look like questions to decline but are answerable (over-refusal checks).
  #   paraphrase    "paraphrase of vNN": the same question as a heldout_v3 case in new words, with the same truths
  #                 (w42 to w62), to measure whether wording changes the answer
  #   refusal       the data and documents can't answer it (w63 to w74): outside the data, personal data,
  #                 predictions, and near-miss traps
  #   two-step      needs two results or a comparison across views (w75 to w82)

  - id: w01
    split: heldout_v4
    question: hows eastgate doing vs goal so far?
    category: pace
    extra: new, casual with typos
    keywords: [Eastgate, goal, pace, doors to date]
    expected_tools: [query_program_data]
    expected_docs: [program-plan#pace-and-projection]
    facts:
      - name: Eastgate doors to date
        sql: |
          SELECT sum(n) FROM (SELECT knocked_at::date, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS n
                              FROM knocks WHERE office = 'Eastgate' GROUP BY 1) d
        abs: 1
      - name: Eastgate goal to date
        sql: SELECT sum(door_goal) FROM daily_goals WHERE office = 'Eastgate' AND goal_date <= '2026-10-18'
        abs: 1

  - id: w02
