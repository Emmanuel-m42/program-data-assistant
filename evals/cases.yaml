    question: Are we on pace for the registration goal, and what cards per hour do we need from here?
    category: VR rate
    keywords: [registration, goal, cards per hour, pace, needed, cards]
    expected_tools: [query_program_data]
    expected_docs: [registration-drive#cards-per-hour]
    facts:
      - name: cards per hour needed
        sql: |
          SELECT ((SELECT sum(card_goal) FROM vr_goals) - (SELECT count(*) FROM vr_cards WHERE NOT is_duplicate))
                 / ((SELECT sum(paid_hours) FROM shifts WHERE program = 'vr' AND shift_date > '2026-10-11') / 7.0 * 12)
        abs: 0.05
      - name: current cards per hour, last 7 days
        sql: |
          SELECT (SELECT count(*) FROM vr_cards WHERE NOT is_duplicate AND collected_at::date > '2026-10-11')
                 / (SELECT sum(paid_hours) FROM shifts WHERE program = 'vr' AND shift_date > '2026-10-11')
        abs: 0.05
      - name: says not on pace
        any_of: [not on pace, not on track, behind, short, below, under, miss]

