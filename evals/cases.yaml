        sql: |
          SELECT 100.0 * (SELECT sum(n) FROM (SELECT knocked_at::date, office, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS n
                                              FROM knocks GROUP BY 1, 2) d) / (SELECT sum(door_goal) FROM daily_goals)
        abs: 0.15
        kind: percent

