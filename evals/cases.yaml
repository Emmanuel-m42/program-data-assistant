  - id: y46
    split: heldout_v5
    question: Which office had the highest contact rate last week, and what's its GOTV cost per door to date?
    category: payroll
    extra: two-step
    keywords: [highest contact rate, last week, cost per door, office]
    expected_tools: [query_program_data]
    expected_docs: [payroll-rules#cost-per-door]
    facts:
      - name: Eastgate had the highest rate
        any_of: [Eastgate]
      - name: Eastgate contact rate last week
        sql: |
          SELECT 100.0 * sum(c) / sum(d) FROM (SELECT knocked_at::date, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS d,
                                                      count(*) FILTER (WHERE NOT rolled_back AND result = 'canvassed') AS c
                                               FROM knocks WHERE office = 'Eastgate' AND knocked_at::date BETWEEN '2026-10-05' AND '2026-10-11' GROUP BY 1) x
        abs: 0.1
        kind: percent
      - name: Eastgate GOTV cost per door to date
        sql: |
          SELECT (SELECT sum(s.paid_hours * p.hourly_rate) FROM shifts s JOIN canvassers c USING (canvasser_id) JOIN pay_rates p USING (role)
                  WHERE s.program = 'gotv' AND s.office = 'Eastgate')
                 / (SELECT sum(n) FROM (SELECT knocked_at::date, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS n FROM knocks
                                        WHERE office = 'Eastgate' GROUP BY 1) d)
        abs: 0.01

