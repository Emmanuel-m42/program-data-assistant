    question: Why does the client's daily report show more doors than our dashboard for Oct 12?
    category: client report
    keywords: [client report, dashboard, Oct 12, difference, gap, attempts, rollback]
    expected_tools: [query_program_data, search_documents]
    expected_docs: [counting-doors#why-the-client-s-numbers-differ-from-ours]
    facts:
      - name: client reported doors Oct 12
        sql: SELECT sum(doors_reported) FROM client_daily_report WHERE report_date = '2026-10-12'
        abs: 2
      - name: dashboard doors Oct 12
        sql: |
          SELECT sum(c) FROM (SELECT office, count(DISTINCT door_id) AS c FROM knocks
                              WHERE knocked_at::date = '2026-10-12' AND NOT rolled_back GROUP BY office) x
        abs: 2
      - name: rolled-back attempts Oct 12
        sql: SELECT count(*) FROM knocks WHERE knocked_at::date = '2026-10-12' AND rolled_back
        abs: 0
      - name: explains rollback
        any_of: [rolled back, rollback, roll back, rolled-back]

  - id: q08
    split: test
    question: Which precincts are untouched or only lightly touched, and is what's left dense enough to keep knocking efficiently?
    category: door gaps
    keywords: [precincts, untouched, lightly touched, dense, density, turf left]
    expected_tools: [query_program_data]
    expected_docs: [program-plan#opening-another-office]
    facts:
      - name: names the dense untouched cluster
        any_of: [P37, P38, P39, P40, Precinct 37, Precinct 38, Precinct 39, Precinct 40]
      - name: untouched doors in dense untouched precincts
        sql: |
          SELECT sum(p.target_doors) FROM precincts p
          WHERE p.doors_per_sq_mi > 2000 AND NOT EXISTS (SELECT 1 FROM knocks k WHERE k.precinct_id = p.precinct_id AND NOT k.rolled_back)
        tol: 0.03

  - id: q09
    split: dev
    question: Are contact rates up or down from last week, and in which offices?
    category: pace
    keywords: [contact rate, last week, up, down, offices, conversations]
    expected_tools: [query_program_data]
    expected_docs: [counting-doors#contacts-and-contact-rate]
    facts:
      - name: Northside this week
        sql: |
          WITH k AS (SELECT * FROM knocks WHERE office = 'Northside' AND NOT rolled_back AND knocked_at::date BETWEEN '2026-10-12' AND '2026-10-18')
          SELECT 100.0 * (SELECT count(*) FROM k WHERE result = 'canvassed')
                 / (SELECT sum(c) FROM (SELECT knocked_at::date, count(DISTINCT door_id) AS c FROM k GROUP BY 1) y)
        abs: 0.6
        kind: percent
      - name: Northside last week
        sql: |
          WITH k AS (SELECT * FROM knocks WHERE office = 'Northside' AND NOT rolled_back AND knocked_at::date BETWEEN '2026-10-05' AND '2026-10-11')
          SELECT 100.0 * (SELECT count(*) FROM k WHERE result = 'canvassed')
                 / (SELECT sum(c) FROM (SELECT knocked_at::date, count(DISTINCT door_id) AS c FROM k GROUP BY 1) y)
        abs: 0.6
        kind: percent
      - name: Eastgate this week
        sql: |
          WITH k AS (SELECT * FROM knocks WHERE office = 'Eastgate' AND NOT rolled_back AND knocked_at::date BETWEEN '2026-10-12' AND '2026-10-18')
          SELECT 100.0 * (SELECT count(*) FROM k WHERE result = 'canvassed')
                 / (SELECT sum(c) FROM (SELECT knocked_at::date, count(DISTINCT door_id) AS c FROM k GROUP BY 1) y)
        abs: 0.6
        kind: percent
      - name: Eastgate last week
        sql: |
          WITH k AS (SELECT * FROM knocks WHERE office = 'Eastgate' AND NOT rolled_back AND knocked_at::date BETWEEN '2026-10-05' AND '2026-10-11')
          SELECT 100.0 * (SELECT count(*) FROM k WHERE result = 'canvassed')
                 / (SELECT sum(c) FROM (SELECT knocked_at::date, count(DISTINCT door_id) AS c FROM k GROUP BY 1) y)
        abs: 0.6
        kind: percent
      - name: Harbor this week
        sql: |
          WITH k AS (SELECT * FROM knocks WHERE office = 'Harbor' AND NOT rolled_back AND knocked_at::date BETWEEN '2026-10-12' AND '2026-10-18')
          SELECT 100.0 * (SELECT count(*) FROM k WHERE result = 'canvassed')
                 / (SELECT sum(c) FROM (SELECT knocked_at::date, count(DISTINCT door_id) AS c FROM k GROUP BY 1) y)
        abs: 0.6
        kind: percent
      - name: Harbor last week
        sql: |
          WITH k AS (SELECT * FROM knocks WHERE office = 'Harbor' AND NOT rolled_back AND knocked_at::date BETWEEN '2026-10-05' AND '2026-10-11')
          SELECT 100.0 * (SELECT count(*) FROM k WHERE result = 'canvassed')
                 / (SELECT sum(c) FROM (SELECT knocked_at::date, count(DISTINCT door_id) AS c FROM k GROUP BY 1) y)
        abs: 0.6
        kind: percent

  - id: q10
    split: test
    question: What are we paying per door by office, and which office is most expensive?
    category: payroll
    keywords: [cost per door, paying, pay, expensive, wages, office]
    expected_tools: [query_program_data]
    expected_docs: [payroll-rules#cost-per-door]
    facts:
      - name: Northside cost per door
        sql: |
          SELECT sum(s.paid_hours * p.hourly_rate) / (SELECT sum(c) FROM (SELECT knocked_at::date, count(DISTINCT door_id) AS c FROM knocks
                 WHERE office = 'Northside' AND NOT rolled_back GROUP BY 1) y)
          FROM shifts s JOIN canvassers c USING (canvasser_id) JOIN pay_rates p USING (role) WHERE s.program = 'gotv' AND s.office = 'Northside'
        tol: 0.03
      - name: Eastgate cost per door
        sql: |
          SELECT sum(s.paid_hours * p.hourly_rate) / (SELECT sum(c) FROM (SELECT knocked_at::date, count(DISTINCT door_id) AS c FROM knocks
                 WHERE office = 'Eastgate' AND NOT rolled_back GROUP BY 1) y)
          FROM shifts s JOIN canvassers c USING (canvasser_id) JOIN pay_rates p USING (role) WHERE s.program = 'gotv' AND s.office = 'Eastgate'
        tol: 0.03
      - name: Harbor cost per door
        sql: |
          SELECT sum(s.paid_hours * p.hourly_rate) / (SELECT sum(c) FROM (SELECT knocked_at::date, count(DISTINCT door_id) AS c FROM knocks
                 WHERE office = 'Harbor' AND NOT rolled_back GROUP BY 1) y)
          FROM shifts s JOIN canvassers c USING (canvasser_id) JOIN pay_rates p USING (role) WHERE s.program = 'gotv' AND s.office = 'Harbor'
        tol: 0.03
      - name: Eastgate is most expensive
        any_of: [Eastgate]

