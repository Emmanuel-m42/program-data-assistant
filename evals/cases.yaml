    question: Is QC getting better or worse week over week, and which office is improving?
    category: QC
    keywords: [QC, week over week, better, worse, improving, flags rate]
    expected_tools: [query_program_data]
    expected_docs: [qc-rules#qc-rate]
    facts:
      - name: Harbor is improving
        any_of: [Harbor]
      - name: Harbor flags per 100 shifts this week
        sql: |
          SELECT 100.0 * (SELECT count(*) FROM qc_flags WHERE office = 'Harbor' AND flag_date >= '2026-10-12') / count(*)
          FROM shifts WHERE program = 'gotv' AND office = 'Harbor' AND shift_date >= '2026-10-12'
        abs: 0.2
      - name: Harbor flags per 100 shifts last week
        sql: |
          SELECT 100.0 * (SELECT count(*) FROM qc_flags WHERE office = 'Harbor' AND flag_date BETWEEN '2026-10-05' AND '2026-10-11') / count(*)
          FROM shifts WHERE program = 'gotv' AND office = 'Harbor' AND shift_date BETWEEN '2026-10-05' AND '2026-10-11'
        abs: 0.2
      # Program-wide, QC got better: 8 flags in 184 shifts last week, 7 in 205 this week.
      - name: program-wide QC is getting better
        any_of: [getting better, is better, got better, improving overall, improved overall, improving program-wide,
                 qc is improving, qc has improved, qc improved]
      - name: program flags per 100 shifts this week
        sql: |
          SELECT 100.0 * (SELECT count(*) FROM qc_flags WHERE flag_date >= '2026-10-12') / count(*)
          FROM shifts WHERE program = 'gotv' AND shift_date >= '2026-10-12'
        abs: 0.1
