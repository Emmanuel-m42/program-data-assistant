# Eval cases for the program data assistant.
#
# Each case:
#   question        exact text sent to the assistant
#   category        demo grouping
#   expected_tools  tools the assistant must call (all of them)
#   expected_docs   passage ids a good retriever returns in its top 4 for this question
#   facts           what the answer must contain. A fact is either
#                     sql: one value computed directly from the raw tables (ground truth, never from the model)
#                          with tol (relative) or abs (absolute) tolerance; kind: percent also accepts a 0-1 fraction
#                     any_of: list of strings, one of which must appear (case-insensitive)
#   should_refuse   true when the data and documents cannot answer it
#   split           dev (used while changing prompts and tools) or test (held out, only for reporting)
#
# Ground truth dates: data through 2026-10-18, this week 2026-10-12..18, last week 2026-10-05..11,
# 16 knocking days left (Oct 19 to Nov 3), 12 registration days left (Oct 19 to Oct 30).

defaults:
  tol: 0.02

cases:
  - id: q01
    split: dev
    question: Are we on pace to hit goal, and where do we land by election day if nothing changes?
    category: pace
    keywords: [pace, goal, election day, projection, on track, land, doors]
    expected_tools: [query_program_data]
    expected_docs: [program-plan#pace-and-projection]
    facts:
      - name: projected doors, all offices
        sql: |
          WITH d AS (SELECT knocked_at::date AS day, office, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS doors FROM knocks GROUP BY 1, 2)
          SELECT sum(doors) + (sum(doors) FILTER (WHERE day > '2026-10-11')) / 7.0 * 16 FROM d
        tol: 0.01
      - name: projected shortfall, all offices
        sql: |
          WITH d AS (SELECT knocked_at::date AS day, office, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS doors FROM knocks GROUP BY 1, 2)
          SELECT (SELECT sum(door_goal) FROM daily_goals) - (sum(doors) + (sum(doors) FILTER (WHERE day > '2026-10-11')) / 7.0 * 16) FROM d
        tol: 0.03
      - name: says we are not on pace
        any_of: [not on pace, not on track, behind, short of, miss, below goal, below the goal, under goal]

  - id: q02
    split: test
    question: Which offices will miss their goal, and by how much?
    category: pace
    keywords: [miss, goal, offices, shortfall, behind, how much]
    expected_tools: [query_program_data]
    expected_docs: [program-plan#pace-and-projection]
    facts:
      - name: Eastgate shortfall
        sql: |
          WITH d AS (SELECT knocked_at::date AS day, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS doors FROM knocks WHERE office = 'Eastgate' GROUP BY 1)
          SELECT (SELECT sum(door_goal) FROM daily_goals WHERE office = 'Eastgate') - (sum(doors) + (sum(doors) FILTER (WHERE day > '2026-10-11')) / 7.0 * 16) FROM d
        tol: 0.03
      - name: Harbor shortfall
        sql: |
          WITH d AS (SELECT knocked_at::date AS day, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS doors FROM knocks WHERE office = 'Harbor' GROUP BY 1)
          SELECT (SELECT sum(door_goal) FROM daily_goals WHERE office = 'Harbor') - (sum(doors) + (sum(doors) FILTER (WHERE day > '2026-10-11')) / 7.0 * 16) FROM d
        tol: 0.03
      - name: names Eastgate
        any_of: [Eastgate]
      - name: names Harbor
        any_of: [Harbor]

  - id: q03
    split: dev
    question: How many more shifts a day does each office need to hit goal?
    category: staffing
    keywords: [shifts, per day, staffing, recruit, more shifts, hit goal]
    expected_tools: [query_program_data]
    expected_docs: [program-plan#shifts-needed]
    facts:
      - name: Eastgate extra shifts per day
        sql: |
          WITH d AS (SELECT knocked_at::date AS day, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS doors FROM knocks WHERE office = 'Eastgate' GROUP BY 1),
          s AS (SELECT count(*) AS n FROM shifts WHERE program = 'gotv' AND office = 'Eastgate' AND shift_date > '2026-10-11')
          SELECT greatest(((SELECT sum(door_goal) FROM daily_goals WHERE office = 'Eastgate') - (SELECT sum(doors) FROM d)) / 16.0
                 / ((SELECT sum(doors) FROM d WHERE day > '2026-10-11')::numeric / s.n) - s.n / 7.0, 0) FROM s
        abs: 0.3
      - name: Harbor extra shifts per day
        sql: |
          WITH d AS (SELECT knocked_at::date AS day, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS doors FROM knocks WHERE office = 'Harbor' GROUP BY 1),
          s AS (SELECT count(*) AS n FROM shifts WHERE program = 'gotv' AND office = 'Harbor' AND shift_date > '2026-10-11')
          SELECT greatest(((SELECT sum(door_goal) FROM daily_goals WHERE office = 'Harbor') - (SELECT sum(doors) FROM d)) / 16.0
                 / ((SELECT sum(doors) FROM d WHERE day > '2026-10-11')::numeric / s.n) - s.n / 7.0, 0) FROM s
        abs: 0.3
      - name: Northside needs none
        any_of: [Northside]

  - id: q04
    split: test
    question: How many of our active canvassers are regulars, not one-day hires?
    category: staffing
    keywords: [active, canvassers, regulars, one-day hires, retention, staff]
    expected_tools: [query_program_data, search_documents]
    expected_docs: [program-plan#staff-definitions]
    facts:
      - name: active regulars
        sql: |
          SELECT count(*) FROM (SELECT canvasser_id FROM shifts WHERE program = 'gotv' GROUP BY canvasser_id
                                HAVING count(DISTINCT shift_date) >= 5 AND max(shift_date) >= '2026-10-12') x
        abs: 0
      - name: active canvassers
        sql: SELECT count(DISTINCT canvasser_id) FROM shifts WHERE program = 'gotv' AND shift_date >= '2026-10-12'
        abs: 0

  - id: q05
    split: dev
    question: Based on our pace and what's left, should we ask the client for more doors, or a second pass on the turf we have?
    category: door gaps
    keywords: [more doors, second pass, turf, client, run out, remaining]
    expected_tools: [query_program_data, search_documents]
    expected_docs: [program-plan#more-doors-or-a-second-pass]
    facts:
      - name: untouched doors left in turf
        sql: SELECT (SELECT sum(target_doors) FROM precincts) - count(DISTINCT door_id) FROM knocks WHERE NOT rolled_back
        tol: 0.02
      - name: doors we can knock in the days left
        sql: |
          WITH d AS (SELECT knocked_at::date AS day, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS doors FROM knocks GROUP BY knocked_at::date, office)
          SELECT (sum(doors) FILTER (WHERE day > '2026-10-11')) / 7.0 * 16 FROM d
        tol: 0.03
      - name: recommends more doors
        any_of: [more doors, more turf, new turf, additional doors, additional turf]

