  - id: w82
    split: heldout_v4
    question: How many extra shifts a day does the office with the biggest projected shortfall need?
    category: staffing
    extra: two-step
    keywords: [extra shifts, biggest shortfall, projection, office]
    expected_tools: [query_program_data]
    expected_docs: [program-plan#shifts-needed]
    facts:
      - name: Eastgate has the biggest shortfall
        any_of: [Eastgate]
      - name: Eastgate extra shifts per day needed
        sql: |
          WITH d AS (SELECT knocked_at::date AS day, count(DISTINCT door_id) FILTER (WHERE NOT rolled_back) AS n FROM knocks
                     WHERE office = 'Eastgate' GROUP BY 1),
               sh AS (SELECT count(*) AS n FROM shifts WHERE program = 'gotv' AND office = 'Eastgate' AND shift_date BETWEEN '2026-10-12' AND '2026-10-18')
          SELECT ((SELECT sum(door_goal) FROM daily_goals WHERE office = 'Eastgate') - (SELECT sum(n) FROM d)) / 16.0
                 / ((SELECT sum(n) FROM d WHERE day BETWEEN '2026-10-12' AND '2026-10-18')::numeric / (SELECT n FROM sh))
                 - (SELECT n FROM sh) / 7.0
        abs: 0.1

