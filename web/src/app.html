<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Static tags for link previews: the app renders in the browser, so crawlers only see this file. -->
		<title>Program data assistant</title>
		<meta
			name="description"
			content="An assistant that answers field program questions from the program's own data and documents, with the SQL rows and passages behind every number. Demo on fictional data, with evals scored against SQL ground truth."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Program data assistant" />
		<meta
			property="og:description"
			content="Answers field program questions from the program's own data and documents, with the sources behind every number. Fictional demo data, evals against SQL ground truth."
		/>
		<meta property="og:url" content="https://emmanuel-m42.github.io/program-data-assistant/" />
		<meta property="og:image" content="https://emmanuel-m42.github.io/program-data-assistant/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The Ask page with an answer, its numbers and the sources behind them" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
